method: |
  Preparation:
  1. Roast hazelnuts carefully
  2. Mix heavy cream and sugar in a pot
  3. Mix the roasted Hazelnuts with the Kakao
  4. Puree heavy cream and Hazelnuts together
  5. Add Margarine for Texture
  Tipps:
  • If you don’t want to use vegan heavy cram you can substitute it with 80% vegan milk a more margarine
