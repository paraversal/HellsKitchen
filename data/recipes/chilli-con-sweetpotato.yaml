method: |
  1. prep
  Bohnen und mais seperat mit wasser abwaschen (optional: die bohnen ach einzeln abwaschen und später getrennt in den topf werfen)
  paprika waschen und entkernen, indem man einen stengel und etwas extra abschneidet, einen streifen reinschneidet und die kerne mit dem finger oder einem löffel rauspoolt.
  paprika in 2 cm dicke ringe schneiden (this will look really cool)
  zwiebel klein schneiden (soll kein granulat werden, aber halt klein, sage 0,3 cm)
  süßkartoffel schälen und in würfel mit ca 1 cm großer Fläche schneiden (bei augenmaß besser etwas größer als etwas kleiner)
  2. chilli
  gestückelte Tomaten (Pikant) Füllmenge 800g in einen topf geben
  170 ml wasser dazugeben, ggf einen schuss hafermilch (20ml), vegane sahne o.ä.
  Gewürze dazugeben und umrühren:

  Tomatenmark 12-15 g (max 15g!)
  Salz 4-5g (max 5g!)
  Knobi (granulat) 0,5g (max!)
  Kümmel (ganz) 1-2 Prisen
  Oregano (gerebelt) ~0,3 g (careful!)
  Paprikapuder (red hot) 3-4 g
  wenn mal will kann man etwas zucker oder zimt dazugeben, ich habs nicht gemacht

  Alles zum köcheln bringen.

  5 minuten köcheln lassen, dann die ersten Bohnen dazugeben. Ich habe kidney und große genommen:

  große bohnen
  Kidney bohnen (kochen recht schnell, die können also 2 minuten später dazugegeben werden
  ca 40 minuten kochen lassen

  in den letzten 8 minuten das mais dazugeben.

  3. sweet potato and paprika
  Eine Pfanne heiß machen, großzügig öl dazugeben

  we are not trying to stir-fry on high heat (otherwise knusprige potatoes)! keep the heat to a medium temperature.

  sweetpotatos rein, deckel drauf
  nach 1-2 minuten die Paprika rein, deckel drauf
  nach weiteren 2-3 minuten die zwiebel rein deckel drauf
  braten und wenden bis die patatas thoroughly fritatas sind (ez ab zu checken indem man mit einer gabel reinpikst). die paprika sollte dann ebenso aufgeweicht aber nicht zerfallen sein.

  ca 10 minuten i didnt really check the time,

  add all together
  Die Patatas und Paprikastreifen ins chilli rühren.
