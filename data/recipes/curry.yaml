method: |
  Preparation:
  1. Cut all vegetables and precook them, except for needed in 2, in the oven
  2. Add onions a pot and let them get translucent, add garlic ginger
  3. Now add chickpeas to the pot and let then cook 3-5 minutes
  4. Add curry past and cook till fragrant
  5. Add the rest of the vegetables and liquid
  6. Spice to your liking
  7. Garnish with spring onions and peanuts if so desired
