method: |
  Preparation:
  1. Slice the cabbage as fine as possible
  2. Cut the carrots into thin strips and the onions into slices
  3. Mix oil, soy sauce, and Vinegar add spices and minced garlic to taste
  4. Mix everything and leave it covert in the fridge for at least 4 hours
  Tips:
  • You can use a mandoline slicer to shave the cabbage resulting in skinny slices
  • For the best flavor let the salat sit for 24 hours
