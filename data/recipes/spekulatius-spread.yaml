name: Spekulatius-spread
category: brunch
portion: 25 g
source: Old Excel sheet
per_100g:
  speculoos-biscuits: 56.6251 g
  margarine: 12.2688 g
  rum-dark: 9.4375 ml
  sugarcane-syrup: 6.1344 g
  amaretto: 4.7188 ml
  spekulatios-spice: 2.0833 g
method: |
  Preparation:
  1. Put the speculations through a food processor
  2. Add Rum, Amaretto and Water to the cookies to achieve a lightly wet sand texture
  3. Let it rest for 30 minutes
  4. Mix with margarine, Zuckerrüben-Sirup, and Spekulatius spices
  Tipps:
  • You can add more rum and/or amaretto if wished, just try and see which amounts taste best for you
