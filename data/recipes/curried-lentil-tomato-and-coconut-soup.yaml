name: Curried lentil, tomato and coconut soup
category: main
portion: 500 g
source: Old Excel sheet
per_100g:
  water: 37 ml
  coconut-cream: 24.69 ml
  tinned-tomatoes: 24.69 g
  ginger: 12.66 g
  onions: 12.66 g
  red-lentils: 9.26 g
  coconut-oil: 2.222 g
  garlic: 0.68 g
  curry-powder: 0.37 g
  lemon-lime-juice: 0.26 ml
  salt: 0.2 g
  pepper: 0.093 g
  msg: 0.0926 g
method: |
  ry onion for 8 min (till caramelised)
  add curry powder chilli garlic and ginger
  fry 2 min while stirring
  add washed and drained lentils and stir for a minuet
  than add tomatoes and smash them
  add 600ml water
  teaspoon of salt and generous grind of pepper

  por coconut milk into a bowl and whisk till smooth and creamy
  Than add to the soup
  bring to a boil, reduce heat and let it simmer for 25 min

  puree it with a blender and add water if to thic

  Serve if wanted with toasted „schwarzbrot“ crumbs
