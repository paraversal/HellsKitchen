method: |
  0.5.  Rehydrate Shrooms as stated on the package
  1.  cook Rice (without salt!)
  2.   cook seawheat sheets shortly with the water
  3.  cut veggie (carrots in small cubes, brocoli in small uneven pieces, bellpepper in small stripes, shrooms in cubes, beansprous halfed and spring onions in rings)
  4. fry veggie with 1/4 of the olive oil (carrots first, than bellpeper than shrooms and at the „end“ the rest above ((only springonion whites)(including edamame))
  5. dry tofu and coat with starch and pepper, than fry immediately wit canola oil.
  6.  grate garlic and ginger, cut onion in fine pieces. mix with 3/4 of the olive oil, tamrin, mirin, MSG, LimeJuice, sugar and Mushroom stir fry sauce. than bring to a boil and let it simmer a bit
  7.  add vegg and rice together and stir. at the end add the sauce while stiring
  8. than sprikel with seasame and springonion greens (mix again)
