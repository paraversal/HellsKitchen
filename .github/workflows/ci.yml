name: CI

# Runs on every pull request: types, tests, and a full build. Nothing is published.
on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check the data files
        run: npm run validate
      - run: npm test
      - run: npm run build
