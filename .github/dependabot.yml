version: 2
updates:
  # One pull request a month for all dependency updates, not one per package.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      all:
        patterns: ['*']
    ignore:
      # svelte-check and SvelteKit accept TypeScript 5 and 6 only. Remove this when they support 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      all:
        patterns: ['*']
